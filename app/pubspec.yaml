name: w_anchor
description: "An anchor drag alarm application."
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.5.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.14.0
  intl: ^0.20.2
  path: ^1.9.1
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/main_icon.png"
  adaptive_icon_monochrome: "assets/icon/main_icon.png"
  
  image_path: "assets/icon/main_icon.png"

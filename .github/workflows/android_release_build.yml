name: Android Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: Create key.properties for android app
        run: |
          echo "storeFile=upload-keystore.jks" > app/android/app/key.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> app/android/app/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> app/android/app/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> app/android/app/key.properties
      
      - name: Install Flutter dependencies for mobile app
        working-directory: ./app
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        working-directory: ./app
        run: flutter build appbundle --release  

      - name: Upload App Bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: menstrudel-release-aab
          path: ./app/build/app/outputs/bundle/release/app-release.aab

      - name: Get version from Git tag
        id: get_version
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV